# golangci-lint configuration (v2 schema). The standard linters plus the
# checks a library's public surface benefits from; `make lint` and CI run it.
version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gocritic
    - unconvert
    - unparam
    - prealloc
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: error-strings
        - name: error-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: unexported-return
        - name: unused-parameter
    gocritic:
      enabled-tags: [diagnostic, style]
      disabled-checks: [commentedOutCode, unnamedResult, paramTypeCombine, ifElseChain, evalOrder]

formatters:
  enable:
    - gofmt
    - goimports
